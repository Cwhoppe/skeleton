name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile C++
        run: |
          cl.exe main.cpp /EHsc /std:c++17 /O2 /Fe:skeleton.exe /link d3d11.lib dxgi.lib dwmapi.lib d3dcompiler.lib user32.lib gdi32.lib ole32.lib /SUBSYSTEM:WINDOWS /ENTRY:wWinMain

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: skeleton.exe
